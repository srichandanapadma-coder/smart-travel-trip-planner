<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - Smart Travel</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!-- Navigation Bar -->
    <header class="navbar">

        <div class="logo">
            Smart<span>Travel</span>
        </div>

        <nav>
            <a href="index.html">Home</a>
            <a href="index.html#about">About</a>
            <a href="index.html#features">Features</a>
            <a href="register.html">Register</a>
        </nav>

    </header>


    <!-- Login Section -->
    <section class="auth-section">

        <div class="auth-card">

            <p class="section-label">
                WELCOME BACK
            </p>

            <h1>Login</h1>

            <p class="auth-description">
                Login to continue planning your journeys.
            </p>


            <form id="loginForm">

                <!-- Email -->
                <div class="form-group">

                    <label for="email">
                        Email
                    </label>

                    <input
                        type="email"
                        id="email"
                        placeholder="Enter your email"
                        required>

                </div>


                <!-- Password -->
                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        placeholder="Enter your password"
                        required>

                </div>


                <!-- Login Button -->
                <button
                    type="submit"
                    class="primary-btn register-btn">

                    Login

                </button>

            </form>


            <!-- Login Message -->
            <p id="loginMessage" class="message"></p>


            <!-- Register Link -->
            <p class="login-link">

                Don't have an account?

                <a href="register.html">
                    Create account
                </a>

            </p>

        </div>

    </section>


    <!-- Footer -->
    <footer>

        <p>
            © 2026 Smart Travel. All rights reserved.
        </p>

    </footer>


    <!-- JavaScript -->
    <script src="js/config.js"></script>
    <script src="js/login.js"></script>

</body>

</html>
