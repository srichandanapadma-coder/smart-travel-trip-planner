<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Register - Smart Travel</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <header class="navbar">

        <div class="logo">
            Smart<span>Travel</span>
        </div>

        <nav>
            <a href="index.html">Home</a>
            <a href="index.html#about">About</a>
            <a href="index.html#features">Features</a>
            <a href="login.html">Login</a>
        </nav>

    </header>


    <section class="auth-section">

        <div class="auth-card">

            <p class="section-label">WELCOME TO SMART TRAVEL</p>

            <h1>Create Account</h1>

            <p class="auth-description">
                Create your account and start planning your trips.
            </p>


            <form id="registerForm">

                <div class="form-group">

                    <label for="name">Full Name</label>

                    <input
                        type="text"
                        id="name"
                        placeholder="Enter your name"
                        required>

                </div>


                <div class="form-group">

                    <label for="email">Email</label>

                    <input
                        type="email"
                        id="email"
                        placeholder="Enter your email"
                        required>

                </div>


                <div class="form-group">

                    <label for="password">Password</label>

                    <input
                        type="password"
                        id="password"
                        placeholder="Enter your password"
                        required>

                </div>


                <button type="submit" class="primary-btn register-btn">
                    Create Account
                </button>

            </form>


            <p id="message" class="message"></p>


            <p class="login-link">
                Already have an account?
                <a href="login.html">Login here</a>
            </p>

        </div>

    </section>


    <footer>

        <p>
            © 2026 Smart Travel. All rights reserved.
        </p>

    </footer>


    <script src="js/config.js"></script>
    <script src="js/register.js"></script>

</body>

</html>
